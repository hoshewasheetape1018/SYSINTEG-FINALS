name: Deploy BlumieS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Create Jotform runtime configuration
        working-directory: ./backend
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: |
          if [ -z "$JOTFORM_API_KEY" ]; then
            echo "::error::The JOTFORM_API_KEY repository secret is missing."
            exit 1
          fi
          php -r '$key = getenv("JOTFORM_API_KEY"); file_put_contents("app/Config/JotformSecrets.php", "<?php\n\nreturn " . var_export(["apiKey" => $key], true) . ";\n");'

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/writable/if0_43188418_blumiesdb
